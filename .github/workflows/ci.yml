name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: 25
  BASE_URL: ${{ vars.BASE_URL }}
  MONGODB_URI: ${{ secrets.MONGODB_URI }}

jobs:
  install-deps:
    environment: dev
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npx nx run-many -t lint typecheck

  unit-tests-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [install-deps, lint-typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npx nx test backend

  unit-tests-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [install-deps, lint-typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npx nx test frontend

  e2e-tests-backend:
    environment: dev
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Start backend server
        run: |
          export MONGODB_URI="${{ env.MONGODB_URI }}"
          echo "Starting backend with NODE_VERSION=$NODE_VERSION"
          nohup npm run dev:backend > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend PID: $(cat backend.pid)"
          echo "Initial backend log output:"
          tail -n 50 backend.log || true

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            echo "Health check attempt $i/30"
            if curl -fsS http://localhost:3333/api/health/db; then
              echo
              echo "Backend is ready!"
              exit 0
            fi
            echo "Backend not ready yet. Recent logs:"
            tail -n 100 backend.log || true
            sleep 2
          done
          echo "Backend failed to become ready. Full log dump:"
          cat backend.log || true
          exit 1

      - run: npx nx e2e backend-e2e
        # continue-on-error: true

      - name: Stop backend server
        run: |
          echo "Final backend logs:"
          cat backend.log || true
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi
        if: always()

  e2e-tests-frontend:
    environment: dev
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests-frontend
    env:
      BASE_URL: http://127.0.0.1:4200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Start frontend dev server
        run: |
          npx nx serve @my-monorepo/frontend --hostname=127.0.0.1 > frontend.log 2>&1 &
          echo $! > frontend.pid
        working-directory: .

      - name: Wait for frontend server
        run: |
          timeout 60 bash -c 'until curl -f "$BASE_URL" > /dev/null 2>&1; do sleep 1; done'

      - run: npx nx e2e frontend-e2e

      - name: Stop frontend server
        run: |
          if [ -f frontend.pid ]; then
            kill $(cat frontend.pid) || true
            rm frontend.pid
          fi
        if: always()

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      [
        lint-typecheck,
        unit-tests-backend,
        unit-tests-frontend,
        e2e-tests-backend,
        e2e-tests-frontend,
      ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npx nx run-many -t build

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
