name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  actions: read
  contents: read

jobs:
  install-deps:
    environment: dev
    name: Install Dependencies
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 25
      BASE_URL: ${{ vars.BASE_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Read Secret Environment Variables
        run: |
          echo "MONGODB_URI value is $MONGODB_URI"
          echo "BASE_URL value is $BASE_URL"
          echo "env variable value are:"
          env

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npx nx run-many -t lint typecheck

  unit-tests-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [install-deps, lint-typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npx nx test backend

  unit-tests-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [install-deps, lint-typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npx nx test frontend

  e2e-tests-backend:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-backend]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo --eval 'db.runCommand("ping").ok' --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Start backend server
        run: |
          npm run dev:backend &
          echo $! > backend.pid

      - name: Wait for backend to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3333/api/health/db; do sleep 2; done'
          echo "Backend is ready!"

      - run: npx nx e2e backend-e2e
        continue-on-error: true

      - name: Stop backend server
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi
        if: always()

  e2e-tests-frontend:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Start frontend dev server
        run: npx nx serve frontend &
        working-directory: .

      - name: Wait for frontend server
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:4200 > /dev/null 2>&1; do sleep 1; done'

      - run: npx nx e2e frontend-e2e
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      [
        lint-typecheck,
        unit-tests-backend,
        unit-tests-frontend,
        e2e-tests-backend,
        e2e-tests-frontend,
      ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npx nx run-many -t build

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
